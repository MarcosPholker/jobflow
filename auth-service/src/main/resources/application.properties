spring.application.name=auth-service

server.port=${AUTH_SERVICE_PORT:8080}
spring.datasource.url=${AUTH_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/jobflow_auth}
spring.datasource.username=${AUTH_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_SERVICE_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET:JobFlowJWTSecretKey2026MuitoSegura123456789}