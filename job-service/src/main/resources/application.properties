spring.application.name=job-service

server.port=${JOB_SERVICE_PORT:8081}
spring.datasource.url=${JOB_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/job_service}
spring.datasource.username=${JOB_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${JOB_SERVICE_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET:JobFlowJWTSecretKey2026MuitoSegura123456789}
